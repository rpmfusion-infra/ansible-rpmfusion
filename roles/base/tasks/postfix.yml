---
- name: Make sure postfix is installed
  ansible.builtin.package:
    state: present
    name:
      - postfix
      - postfix-pcre
  tags:
  - postfix

- name: Make sure postfix-lmdb is installed
  ansible.builtin.package:
    state: present
    name: postfix-lmdb
  when: not (ansible_distribution == "RedHat" and ansible_distribution_major_version <= "8")
  tags:
  - postfix
  - base

- name: /etc/postfix/main.cf
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /etc/postfix/main.cf
    mode: "0644"
  with_first_found:
    - "{{ postfix_maincf }}"
    - "postfix/main.cf/main.cf.{{ ansible_fqdn }}"
    - "postfix/main.cf/main.cf.{{ inventory_hostname }}"
    - "postfix/main.cf/main.cf.{{ host_group }}"
    - "postfix/main.cf/main.cf.{{ postfix_group }}"
    - "postfix/main.cf/main.cf.{{ datacenter }}"
    - "postfix/main.cf/main.cf"
  notify:
  - Restart postfix
  - Create lmdb files
  tags:
  - postfix
  - config
  - base
  - smtp_auth_relay

- name: Install /etc/postfix/master.cf file
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /etc/postfix/master.cf
    mode: "0644"
  with_first_found:
    - "postfix/master.cf/master.cf.{{ inventory_hostname }}"
    - "postfix/master.cf/master.cf.{{ host_group }}"
    - "postfix/master.cf/master.cf.{{ postfix_group }}"
    - "postfix/master.cf/master.cf"
  when: inventory_hostname.startswith(('smtp-mm', 'mailman', 'bastion', 'smtp-auth'))
  notify:
  - Restart postfix
  tags:
  - postfix
  - config
  - base

- name: Install /etc/postfix/header_checks_submission file
  ansible.builtin.copy:
    src: postfix/header_checks_submission.smtp-auth
    dest: /etc/postfix/header_checks_submission
    mode: "0644"
  when: inventory_hostname.startswith("smtp-auth")
  notify:
  - Restart postfix
  tags:
  - postfix
  - config
  - base

- name: Deploy sender_access file
  ansible.builtin.copy:
    src: "{{ private }}/files/smtpd/sender_access.{{ postfix_group }}"
    dest: "/etc/postfix/sender_access"
    mode: "0644"
  when: postfix_group == "smtp-mm" or postfix_group == "mailman" or postfix_group == "gateway"
  notify:
  - Restart postfix
  tags:
  - postfix
  - config
  - base

- name: Create sender_access hash
  command: postmap hash:/etc/postfix/sender_access
  changed_when: false
  when: postfix_group == "smtp-mm"
  tags:
  - postfix
  - config
  - base

- name: Enable postfix to start
  ansible.builtin.service:
    name: postfix
    state: started
    enabled: true
  tags:
  - service
  - base

- name: Install /etc/postfix/transport file
  ansible.builtin.copy:
    src: "postfix/{{ postfix_transport_filename }}"
    dest: /etc/postfix/transport
    mode: "0644"
  when: inventory_hostname.startswith(('smtp-mm','bastion')) and env != 'staging'
  notify:
  - Rebuild postfix transport
  - Restart postfix
  tags:
  - postfix
  - base
  - config

- name: Install /etc/postfix/bysender file
  ansible.builtin.copy:
    src: "postfix/bysender"
    dest: /etc/postfix/bysender
    mode: "0644"
  when: inventory_hostname.startswith(('bastion')) and env != 'staging'
  notify:
  - Rebuild postfix bysender
  - Restart postfix
  tags:
  - postfix
  - base
  - config

- name: Create /etc/postfix/tls_policy
  ansible.builtin.copy:
    src: "postfix/tls_policy"
    dest: /etc/postfix/tls_policy
    mode: "0644"
  when: inventory_hostname.startswith(('bastion','smtp-mm','pagure')) and env != 'staging'
  notify:
  - Rebuild postfix tls_policy
  - Restart postfix
  tags:
  - postfix

# Install gateway tls cert as a pem file.
# This has: private key, then cert, then intermediate cert
# This cert is a digicert one, renew it there.
- name: Install /etc/pki/tls/private/gateway-chain.pem
  ansible.builtin.copy:
    src: "{{ private }}/files/smtpd/gateway-chain.pem"
    dest: /etc/pki/tls/private/gateway-chain.pem
    owner: root
    group: root
    mode: "0600"
  when: inventory_hostname.startswith(('bastion','smtp-mm')) and env != 'staging'
  notify:
  - Restart postfix
  tags:
  - postfix
