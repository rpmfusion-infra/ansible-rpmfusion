---
- name: Apply interface-changes
  ansible.builtin.command: nmcli con up {{ item.split()[1] }}
  async: 1
  poll: 0
  with_items:
  - "{{ if_uuid.stdout_lines }}"

- name: Restart iptables
  ansible.builtin.service:
    name: iptables
    state: restarted

- name: Restart nftables
  ansible.builtin.service:
    name: nftables
    state: restarted

- name: Restart ip6tables
  ansible.builtin.service:
    name: ip6tables
    state: restarted

- name: Restart NetworkManager
  ansible.builtin.service:
    name: NetworkManager
    state: restarted

- name: Reload NetworkManager-connections
  ansible.builtin.command: nmcli c reload

- name: Restart postfix
  ansible.builtin.service:
    name: postfix
    state: restarted

- name: Restart rsyslog
  ansible.builtin.service:
    name: rsyslog
    state: restarted

- name: Restart watchdog
  ansible.builtin.service:
    name: watchdog
    state: restarted

- name: Reload libvirtd
  ansible.builtin.service:
    name: libvirtd
    state: reloaded
  ignore_errors: true
  when: ansible_virtualization_role == 'host'

- name: Create lmdb files
  ansible.builtin.include_tasks: lmdb.yml
  listen: "Create lmdb files"
