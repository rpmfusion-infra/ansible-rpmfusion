---
#
# Setup postgresql server.
#
- name: Install postgresql server packages (Fedora)
  ansible.builtin.package:
    state: present
    name:
    - postgresql-server
    - postgresql-contrib
    - postgresql-plpython3
    - python3-psycopg2
    - pxz
    - mbuffer
  when: ansible_distribution_major_version|int >= 29 and ansible_distribution == 'Fedora' and ansible_cmdline.ostree is not defined
  tags:
  - packages
  - postgresql

- name: Install postgresql server packages (EL 8 and 9)
  ansible.builtin.package:
    state: present
    name:
    - postgresql-server
    - postgresql-contrib
    - postgresql-plpython3
    - python3-psycopg2
    - pxz
    - mbuffer
  when: ansible_distribution_major_version|int < 10 and ansible_distribution == 'RedHat' and ansible_cmdline.ostree is not defined
  tags:
  - packages
  - postgresql

- name: Install postgresql server packages (EL 10)
  ansible.builtin.package:
    state: present
    name:
    - postgresql18-server
    - postgresql18-contrib
    - postgresql18-plpython3
    - python3-psycopg2
    - pxz
    - mbuffer
  when: ansible_distribution_major_version|int == 10 and ansible_distribution == 'RedHat' and ansible_cmdline.ostree is not defined
  tags:
  - packages
  - postgresql

- name: Set kernel shared memory max to a larger value
  sysctl: name=kernel.shmmax value={{ kernel_shmmax }}
  when: kernel_shmmax is defined
  notify:
  - Restart postgresql
  tags:
  - postgresql

- name: Initialize postgres if necessary
  ansible.builtin.command: /usr/bin/postgresql-setup initdb
           creates=/var/lib/pgsql/data/postgresql.conf
  notify:
  - Restart postgresql
  tags:
  - postgresql

- name: Set postgresql-server to run on boot
  service: name=postgresql enabled=yes
  ignore_errors: true
  notify:
  - Restart postgresql
  tags:
  - service
  - postgresql

- name: Add our postgres config file.
  ansible.builtin.copy: >
    src={{ item }}
    dest=/var/lib/pgsql/data/{{ item }}
    owner=postgres
  with_items:
  - pg_hba.conf
  notify:
  - Restart postgresql
  tags:
  - config
  - postgresql

  # Eg. postgresql18
- name: Postgresql config template (el10 / postgresql 18)
  ansible.builtin.template: dest=/var/lib/pgsql/data/postgresql.conf src=postgresql.conf-18
  when: (ansible_distribution_major_version|int == 10 and ansible_distribution == 'RedHat')
  notify:
  - Restart postgresql
  tags:
  - config
  - postgresql

- name: Ensure postgres has a place to backup to
  ansible.builtin.file: dest=/backups state=directory owner=postgres
  tags:
  - postgresql

- name: Copy over backup scriplet
  ansible.builtin.copy: src=backup-database dest=/usr/local/bin/backup-database mode=0755
  when: not inventory_hostname.startswith(('db-koji01.rdu3', 'db-datanommer'))
  tags:
  - postgresql

- name: Set up some cronjobs to backup databases as configured
  ansible.builtin.template: >
    src=cron-backup-database
    dest=/etc/cron.d/cron-backup-database-{{ item }}
  with_items:
  - "{{ dbs_to_backup }}"
  when: dbs_to_backup != []
  tags:
  - cron
  - postgresql


